[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmg-quotes"
version = "0.1.0"
description = "Build Tippecanoe Memory Gardens family quotes from the price book"
requires-python = ">=3.10"
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["playwright>=1.40"]
dev = ["pytest>=7.4", "playwright>=1.40"]

[project.scripts]
tmg-quote = "tmg_quotes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmg_quotes = ["templates/*.j2", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
